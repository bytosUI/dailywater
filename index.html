<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydratation">
<meta name="theme-color" content="#0a1628">
<title>Hydratation · Thibaut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a1628;
    --bg-gradient: radial-gradient(ellipse at top, #1e3a5f 0%, #0a1628 60%);
    --water: #4ea8de;
    --water-light: #7dc8ff;
    --water-deep: #2563a8;
    --text: #f0f7ff;
    --text-muted: #8aa5c4;
    --accent: #ffd166;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
  }
  
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    background-image: var(--bg-gradient);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
    padding-top: max(2rem, env(safe-area-inset-top));
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  
  .bubbles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(78,168,222,0.05));
    bottom: -100px;
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-120vh) translateX(20px); opacity: 0; }
  }
  
  .container {
    max-width: 520px;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .greeting {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 2.8rem;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--water-light), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.3rem;
  }
  #userName { cursor: pointer; }
  .date {
    font-size: 0.9rem;
    color: var(--text-muted);
    text-transform: capitalize;
  }
  
  .progress-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2rem;
    margin-bottom: 2rem;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
  }
  .progress-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(78,168,222,0.08), transparent 50%);
    pointer-events: none;
  }
  
  .glass-container {
    position: relative;
    width: 140px;
    height: 180px;
    margin: 0 auto 1.5rem;
  }
  .glass {
    position: absolute;
    inset: 0;
    border: 3px solid rgba(255,255,255,0.2);
    border-top: none;
    border-radius: 0 0 30px 30px;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
  }
  .water {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, var(--water-light), var(--water), var(--water-deep));
    transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 -2px 20px rgba(78,168,222,0.5);
  }
  .water::before, .water::after {
    content: '';
    position: absolute;
    top: -15px;
    left: 0;
    right: 0;
    height: 30px;
    background: var(--water-light);
    border-radius: 50%;
  }
  .water::before {
    animation: wave 3s linear infinite;
    opacity: 0.7;
  }
  .water::after {
    animation: wave 4s linear infinite reverse;
    opacity: 0.4;
  }
  @keyframes wave {
    0%, 100% { transform: translateX(-25%) scaleX(1.5); }
    50% { transform: translateX(0%) scaleX(1.5); }
  }
  
  .stats {
    display: flex;
    justify-content: space-around;
    text-align: center;
    margin-top: 1.5rem;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    font-weight: 500;
    color: var(--water-light);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-top: 0.3rem;
  }
  .stat-divider {
    width: 1px;
    background: var(--border);
  }
  
  .glasses-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.8rem;
    margin-bottom: 2rem;
  }
  .glass-btn {
    aspect-ratio: 1;
    border: 2px solid var(--border);
    background: var(--card);
    border-radius: 16px;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: var(--text-muted);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }
  .glass-btn:active {
    transform: scale(0.95);
  }
  .glass-btn.filled {
    border-color: var(--water);
    background: linear-gradient(135deg, var(--water-deep), var(--water));
    color: white;
    box-shadow: 0 6px 20px rgba(78,168,222,0.4);
  }
  .glass-btn .number {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  .glass-btn.filled .number { color: rgba(255,255,255,0.7); }
  
  .glass-btn .check {
    opacity: 0;
    transform: scale(0);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .glass-btn.filled .check {
    opacity: 1;
    transform: scale(1);
  }
  
  .actions {
    display: flex;
    gap: 0.8rem;
    margin-bottom: 2rem;
  }
  .btn {
    flex: 1;
    padding: 0.9rem;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .btn:active {
    background: rgba(255,255,255,0.08);
    transform: scale(0.97);
  }
  
  .history {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.5rem;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .history-title {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 1rem;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .history-bars {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    height: 80px;
    margin-bottom: 0.8rem;
  }
  .day-bar {
    flex: 1;
    background: rgba(78,168,222,0.15);
    border-radius: 6px;
    position: relative;
    transition: all 0.3s;
    min-height: 6px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .day-bar-fill {
    width: 100%;
    background: linear-gradient(180deg, var(--water-light), var(--water));
    border-radius: 6px;
    transition: height 0.6s ease;
  }
  .day-bar.today {
    box-shadow: 0 0 0 2px var(--accent);
  }
  .day-labels {
    display: flex;
    gap: 8px;
  }
  .day-label {
    flex: 1;
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .message {
    text-align: center;
    margin-top: 1.5rem;
    padding: 1rem;
    background: rgba(255, 209, 102, 0.08);
    border: 1px solid rgba(255, 209, 102, 0.2);
    border-radius: 12px;
    font-size: 0.9rem;
    color: var(--accent);
    font-style: italic;
    font-family: 'Fraunces', serif;
  }
  
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--water-deep);
    color: white;
    padding: 0.9rem 1.5rem;
    border-radius: 30px;
    font-size: 0.9rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
  
  @media (max-width: 480px) {
    h1 { font-size: 2.2rem; }
    .glass-btn { font-size: 1.5rem; }
    .stat-value { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<div class="container">
  <div class="header">
    <div class="greeting">Hydratation quotidienne</div>
    <h1>Bonjour <span id="userName" title="Toucher pour changer le prénom">…</span></h1>
    <div class="date" id="date"></div>
  </div>

  <div class="progress-section">
    <div class="glass-container">
      <div class="glass">
        <div class="water" id="water" style="height: 0%;"></div>
      </div>
    </div>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="count">0/8</div>
        <div class="stat-label">Verres</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="ml">0 ml</div>
        <div class="stat-label">Volume</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value" id="percent">0%</div>
        <div class="stat-label">Objectif</div>
      </div>
    </div>
  </div>

  <div class="glasses-grid" id="grid"></div>

  <div class="actions">
    <button class="btn" onclick="addGlass()">+ Ajouter un verre</button>
    <button class="btn" onclick="resetDay()">↻ Réinitialiser</button>
  </div>

  <div class="history">
    <div class="history-title">
      <span>7 derniers jours</span>
      <span style="font-size: 0.75rem; color: var(--text-muted); font-family: 'Inter';" id="streak"></span>
    </div>
    <div class="history-bars" id="historyBars"></div>
    <div class="day-labels" id="historyLabels"></div>
  </div>

  <div class="message" id="message">💧 Démarre ta journée par un grand verre d'eau au réveil</div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOTAL_GLASSES = 8;
const ML_PER_GLASS = 250;
const STORAGE_PREFIX = 'hydratation_';

function createBubbles() {
  const container = document.getElementById('bubbles');
  for (let i = 0; i < 15; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 60 + 20;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.animationDuration = (Math.random() * 20 + 15) + 's';
    bubble.style.animationDelay = -Math.random() * 20 + 's';
    container.appendChild(bubble);
  }
}

function setDate() {
  const now = new Date();
  const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
}

function getTodayKey() {
  return STORAGE_PREFIX + new Date().toISOString().split('T')[0];
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push({
      key: STORAGE_PREFIX + d.toISOString().split('T')[0],
      label: d.toLocaleDateString('fr-FR', { weekday: 'short' }).substring(0, 3),
      isToday: i === 0
    });
  }
  return days;
}

let currentCount = 0;

function loadToday() {
  try {
    const value = localStorage.getItem(getTodayKey());
    currentCount = value ? parseInt(value) : 0;
  } catch (e) {
    currentCount = 0;
  }
  render();
}

function saveToday() {
  try {
    localStorage.setItem(getTodayKey(), String(currentCount));
  } catch (e) {
    console.error('Sauvegarde échouée', e);
  }
}

const messages = [
  "💧 Démarre ta journée par un grand verre d'eau au réveil",
  "✨ Premier verre validé ! Continue comme ça",
  "💪 2 verres : bon rythme, tu construis l'habitude",
  "🌊 3 verres : tu es lancé, ne lâche rien",
  "⚡ La moitié de l'objectif ! Tu gères",
  "🔥 5 verres : excellent, plus que 3",
  "🎯 6 verres : la ligne d'arrivée est proche",
  "🏆 7 verres : encore un effort, tu y es presque !",
  "👑 Objectif atteint ! Bravo {name}, 2L hydratés ✨"
];

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 1; i <= TOTAL_GLASSES; i++) {
    const btn = document.createElement('button');
    btn.className = 'glass-btn' + (i <= currentCount ? ' filled' : '');
    btn.innerHTML = `<span class="number">${i}</span><span class="check">${i <= currentCount ? '💧' : '○'}</span>`;
    btn.onclick = () => toggleGlass(i);
    grid.appendChild(btn);
  }
  
  document.getElementById('count').textContent = currentCount + '/' + TOTAL_GLASSES;
  document.getElementById('ml').textContent = (currentCount * ML_PER_GLASS) + ' ml';
  const pct = Math.round((currentCount / TOTAL_GLASSES) * 100);
  document.getElementById('percent').textContent = pct + '%';
  
  document.getElementById('water').style.height = pct + '%';
  
  const rawMsg = messages[Math.min(currentCount, messages.length - 1)];
  document.getElementById('message').textContent = rawMsg.replace('{name}', getUserName());
  
  renderHistory();
}

function toggleGlass(num) {
  if (num <= currentCount) {
    currentCount = num - 1;
  } else {
    currentCount = num;
    showToast(`💧 Verre ${num} validé · ${num * ML_PER_GLASS} ml`);
    if (currentCount === TOTAL_GLASSES) {
      setTimeout(() => showToast('🏆 Objectif 2L atteint ! Bravo !'), 800);
    }
  }
  saveToday();
  render();
}

function addGlass() {
  if (currentCount < TOTAL_GLASSES) {
    currentCount++;
    showToast(`💧 +1 verre · Total : ${currentCount * ML_PER_GLASS} ml`);
    if (currentCount === TOTAL_GLASSES) {
      setTimeout(() => showToast('🏆 Objectif 2L atteint ! Bravo !'), 800);
    }
    saveToday();
    render();
  } else {
    showToast('Tu as déjà atteint ton objectif aujourd\'hui ✨');
  }
}

function resetDay() {
  if (confirm('Réinitialiser ton compteur du jour ?')) {
    currentCount = 0;
    saveToday();
    render();
    showToast('Compteur réinitialisé');
  }
}

function renderHistory() {
  const days = getLast7Days();
  const bars = document.getElementById('historyBars');
  const labels = document.getElementById('historyLabels');
  bars.innerHTML = '';
  labels.innerHTML = '';
  
  let streak = 0;
  let counts = [];
  
  for (const day of days) {
    let count = 0;
    try {
      const value = localStorage.getItem(day.key);
      count = value ? parseInt(value) : 0;
    } catch (e) {
      count = 0;
    }
    counts.push(count);
    
    const bar = document.createElement('div');
    bar.className = 'day-bar' + (day.isToday ? ' today' : '');
    const pct = (count / TOTAL_GLASSES) * 100;
    bar.innerHTML = `<div class="day-bar-fill" style="height: ${pct}%"></div>`;
    bar.title = `${count}/${TOTAL_GLASSES} verres`;
    bars.appendChild(bar);
    
    const lbl = document.createElement('div');
    lbl.className = 'day-label';
    lbl.textContent = day.isToday ? 'AUJ' : day.label;
    labels.appendChild(lbl);
  }
  
  for (let i = counts.length - 1; i >= 0; i--) {
    if (counts[i] >= TOTAL_GLASSES) streak++;
    else break;
  }
  
  document.getElementById('streak').textContent = streak > 0 ? `🔥 ${streak} jour${streak > 1 ? 's' : ''} d'affilée` : '';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window.toastTimeout);
  window.toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

const NAME_KEY = 'hydratation_user_name';

function getUserName() {
  try {
    return localStorage.getItem(NAME_KEY) || '';
  } catch (e) {
    return '';
  }
}

function setUserName(name) {
  try {
    localStorage.setItem(NAME_KEY, name);
  } catch (e) {}
  document.getElementById('userName').textContent = name;
  render();
}

function askUserName(force) {
  const current = getUserName();
  if (current && !force) {
    document.getElementById('userName').textContent = current;
    return;
  }
  const input = prompt('Quel est ton prénom ?', current || '');
  const trimmed = (input || '').trim();
  if (trimmed) {
    setUserName(trimmed);
  } else if (!current) {
    document.getElementById('userName').textContent = 'toi';
  }
}

document.getElementById('userName').addEventListener('click', () => askUserName(true));

createBubbles();
setDate();
askUserName(false);
loadToday();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((err) => {
      console.warn('Service worker non enregistré', err);
    });
  });
}
</script>

</body>
</html>
